# mkdocs.yml
site_name: Oolite Documentation
site_url: https://oolite.readthedocs.io/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections

plugins:
  - search
  - mkdoxy:
      projects:
        # You can define multiple projects if you want to separate Obj-C and C++
        oolite:
          # Path to your source code (relative to mkdocs.yaml)
          src-dirs: ../src
          full-doc: True
          debug: True
          # Custom Doxygen settings injected into the generation
          doxy-cfg:
            GENERATE_LATEX: False
            GENERATE_HTML: False
            GENERATE_XML: True
            RECURSIVE: True
            # Crucial for Oolite: Add Obj-C and C++ extensions
            FILE_PATTERNS: "*.c *.cc *.cxx *.cpp *.c++ *.h *.hh *.hxx *.hpp *.m *.mm"
            # Parse Objective-C specific syntax
            EXTENSION_MAPPING: m=Objective-C mm=Objective-C++
            # Graphviz settings (optional)
            SOURCE_BROWSER: True
            INLINE_SOURCES: True
            REFERENCED_BY_RELATION: True
            REFERENCES_RELATION: True
            REFERENCES_LINK_SOURCE: False
            SOURCE_TOOLTIPS: True
            HAVE_DOT: True
            CLASS_GRAPH: True
            QUIET: False
            WARNINGS: True
            WARN_IF_UNDOCUMENTED: True
            # This ensures warnings go to the build log
            WARN_LOGFILE: ""

nav:
  - Home: index.md
  - "User Manual": manual.md
  - API Reference:
      - "Overview": "oolite/annotated.md"
      - "Classes":
          - "Alphabetical Index": "oolite/classes.md"
          - "Class Hierarchy": "oolite/hierarchy.md"
          - "Class Members": "oolite/class_members.md"
          - "Member Functions": "oolite/class_member_functions.md"
          - "Member Variables": "oolite/class_member_variables.md"
      - "Namespaces":
          - "Namespace List": "oolite/namespaces.md"
          - "Namespace Members": "oolite/namespace_members.md"
      - "Files & Code":
          - "File List": "oolite/files.md"
          - "Functions": "oolite/functions.md"
          - "Macros": "oolite/macros.md"
          - "Variables": "oolite/variables.md"
      - "Advanced":
          - "Modules": "oolite/modules.md"
          - "Related Pages": "oolite/pages.md"
          - "Typedefs": "oolite/class_member_typedefs.md"
          - "Enums": "oolite/class_member_enums.md"