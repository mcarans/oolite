# mkdocs.yml
site_name: Oolite Documentation
site_url: https://oolite.readthedocs.io/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections

plugins:
  - search
  - mkdoxy:
      projects:
        # You can define multiple projects if you want to separate Obj-C and C++
        oolite:
          # Path to your source code (relative to mkdocs.yaml)
          src-dirs: ../src
          full-doc: True
          debug: True
          # Custom Doxygen settings injected into the generation
          doxy-cfg:
            GENERATE_LATEX: NO
            GENERATE_HTML: NO
            GENERATE_XML: YES
            RECURSIVE: YES
            # Crucial for Oolite: Add Obj-C and C++ extensions
            FILE_PATTERNS: "*.c *.cc *.cxx *.cpp *.c++ *.h *.hh *.hxx *.hpp *.m *.mm"
            # Parse Objective-C specific syntax
            EXTENSION_MAPPING: m=Objective-C mm=Objective-C++
            # Graphviz settings (optional)
            SOURCE_BROWSER: YES
            INLINE_SOURCES: YES
            REFERENCED_BY_RELATION: YES
            REFERENCES_RELATION: YES
            REFERENCES_LINK_SOURCE: NO
            SOURCE_TOOLTIPS: YES
            HAVE_DOT: YES
            CLASS_GRAPH: YES
            QUIET: NO
            WARNINGS: YES
            WARN_IF_UNDOCUMENTED: YES
            # This ensures warnings go to the build log
            WARN_LOGFILE: ""

nav:
  - Home: index.md
  - "User Manual": manual.md
  - API Reference:
      # This points to the virtual files generated by MkDoxy
      - Classes: classes.md
      - Files: files.md