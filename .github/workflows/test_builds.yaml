name: Build Oolite AppImage on various distros
on:
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: >-
        --cap-add SYS_ADMIN
        --device /dev/fuse
        --security-opt apparmor:unconfined
    steps:
      - name: Update Ubuntu
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt update
          apt upgrade -y
          apt install -y ca-certificates build-essential curl git
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - name: Checkout dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          DevEnvironments/Linux/checkout_deps.sh
      - name: Install packages and build Oolite
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          DevEnvironments/Linux/install.sh pkg-appimage

  fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
      options: >-
        --cap-add SYS_ADMIN
        --device /dev/fuse
        --security-opt apparmor:unconfined
    steps:
      - name: Update Fedora
        run: |
          dnf -y update
          dnf -y install git
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - name: Checkout dependencies
        run: |
          DevEnvironments/Linux/checkout_deps.sh
      - name: Install packages and build Oolite
        run: |
          DevEnvironments/Linux/install.sh pkg-appimage

  arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: >-
        --cap-add SYS_ADMIN
        --device /dev/fuse
        --security-opt apparmor:unconfined
    steps:
      - name: Update Arch
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed git
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - name: Checkout dependencies
        run: |
          DevEnvironments/Linux/checkout_deps.sh
      - name: Install packages and build Oolite
        run: |
          DevEnvironments/Linux/install.sh pkg-appimage
